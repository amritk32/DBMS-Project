<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Library Management System — Operations Workspace</title>
  <meta name="description" content="Production-grade Library Management System workspace for catalogue, inventory, students, and circulation desk operations." />

  <!-- Google Fonts: Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Core Stylesheet -->
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="app-container">
    <!-- Sidebar Navigation -->
    <aside class="app-sidebar" aria-label="Main Navigation">
      <div class="brand-section">
        <div class="brand-icon" aria-hidden="true">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
        </div>
        <div>
          <h1 class="brand-title">Athenaeum</h1>
          <span class="brand-subtitle">Library DBMS</span>
        </div>
      </div>

      <nav class="nav-menu">
        <a href="#dashboard" class="nav-item active" data-route="dashboard" id="nav-dashboard">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
          Dashboard & Reports
        </a>
        <a href="#catalogue" class="nav-item" data-route="catalogue" id="nav-catalogue">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
          Catalogue & Search
        </a>
        <a href="#inventory" class="nav-item" data-route="inventory" id="nav-inventory">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>
          Branch & Inventory
        </a>
        <a href="#circulation" class="nav-item" data-route="circulation" id="nav-circulation">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
          Circulation Desk
        </a>
        <a href="#students" class="nav-item" data-route="students" id="nav-students">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          Student Directory
        </a>
      </nav>

      <!-- Sidebar Footer with Health Status Indicator -->
      <div class="sidebar-footer">
        <div class="health-status-badge" id="system-health-badge" title="Live status polling GET /health">
          <div class="health-dot" id="health-dot"></div>
          <span id="health-text">Connecting to API...</span>
        </div>
      </div>
    </aside>

    <!-- Main Workspace -->
    <main class="app-main" id="main-content">
      <!-- Sticky Top Bar -->
      <header class="top-bar">
        <div>
          <h2 class="page-header-title" id="header-title">Dashboard & Reports</h2>
          <p class="page-header-description" id="header-description">Live operational summary, health status, and overdue loan monitoring.</p>
        </div>
        <div class="top-bar-actions">
          <span class="badge badge-peach" style="font-weight: 700; font-size: 12px;">SQLite + FastAPI</span>
        </div>
      </header>

      <!-- Dynamic View Container -->
      <section class="content-body" id="view-container">
        <!-- Rendered by JavaScript route controller -->
      </section>
    </main>
  </div>

  <!-- Global Modal Host -->
  <div id="global-modal" class="modal-overlay" aria-hidden="true"></div>

  <!-- Global Toast Host -->
  <div id="toast-container" class="toast-container" aria-live="polite"></div>

  <!-- Application Script -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
